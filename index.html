<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NailStudio Mobile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 h-full flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <!-- GŁÓWNY NAGŁÓWEK -->
    <header class="bg-stone-800 border-b border-stone-700/50 px-4 py-3 flex justify-between items-center sticky top-0 z-20">
        <div>
            <span class="text-[10px] uppercase tracking-widest text-rose-400 font-bold">Salon Manicure</span>
            <h1 class="text-base font-bold text-stone-100">Panel Zarządzania 💅</h1>
        </div>
        <button onclick="app.syncData()" id="syncBtn" class="px-3 py-1.5 bg-stone-700 hover:bg-stone-600 text-stone-200 rounded-xl text-xs font-medium transition flex items-center gap-1.5">
            <span>🔄</span> Zapisane
        </button>
    </header>

    <!-- ZAWARTOŚĆ DYNAMICZNA -->
    <main id="appContent" class="flex-grow p-4 overflow-y-auto pb-24 max-w-lg mx-auto w-full">
        <!-- Tutaj ładowane są widoki -->
    </main>

    <!-- DOLNY PASEK NAWIGACJI (Mobilny) -->
    <nav class="bg-stone-800 border-t border-stone-700/50 fixed bottom-0 left-0 right-0 z-20 max-w-lg mx-auto grid grid-cols-3 p-2 text-center">
        <button onclick="app.switchTab('clients')" id="nav-clients" class="py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 text-rose-400 bg-stone-700/50 transition">
            <span class="text-base">👥</span> Klientki
        </button>
        <button onclick="app.switchTab('calendar')" id="nav-calendar" class="py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 text-stone-400 hover:text-stone-200 transition">
            <span class="text-base">📅</span> Wizyty
        </button>
        <button onclick="app.switchTab('settings')" id="nav-settings" class="py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 text-stone-400 hover:text-stone-200 transition">
            <span class="text-base">⚙️</span> Ustawienia
        </button>
    </nav>

    <!-- SKRYPT APLIKACJI -->
    <script>
        // Główny obiekt aplikacji (lokalna baza + pamięć podręczna w stylu PROFINS)
        const app = {
            currentTab: 'clients',
            clients: JSON.parse(localStorage.getItem('nail_clients')) || [
                { id: 1, name: 'Anna Nowak', phone: '500100200', notes: 'Preferuje migdałki, uczulenie na cleaner X.', token: 'ania123' },
                { id: 2, name: 'Katarzyna Kowal', phone: '600200300', notes: 'Krótkie paznokcie, lubi czerwień.', token: 'kasia456' }
            ],
            appointments: JSON.parse(localStorage.getItem('nail_appointments')) || [
                { id: 1, clientName: 'Anna Nowak', date: '2026-11-15 10:00', service: 'Hybryda + nadbudowa' }
            ],

            init() {
                this.switchTab('clients');
            },

            saveLocal() {
                localStorage.setItem('nail_clients', JSON.stringify(this.clients));
                localStorage.setItem('nail_appointments', JSON.stringify(this.appointments));
            },

            switchTab(tab) {
                this.currentTab = tab;
                ['clients', 'calendar', 'settings'].forEach(t => {
                    const btn = document.getElementById(`nav-${t}`);
                    if(t === tab) {
                        btn.className = "py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 text-rose-400 bg-stone-700/50 transition";
                    } else {
                        btn.className = "py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 text-stone-400 hover:text-stone-200 transition";
                    }
                });
                this.render();
            },

            render() {
                const container = document.getElementById('appContent');
                if (this.currentTab === 'clients') {
                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="bg-stone-800 p-4 rounded-2xl border border-stone-700/50 space-y-3">
                                <h2 class="font-bold text-sm text-stone-200">➕ Nowa Klientka</h2>
                                <input type="text" id="cName" placeholder="Imię i nazwisko" class="w-full bg-stone-900 border border-stone-700 rounded-xl px-3 py-2.5 text-xs text-stone-100 focus:outline-none focus:border-rose-400" />
                                <input type="tel" id="cPhone" placeholder="Telefon" class="w-full bg-stone-900 border border-stone-700 rounded-xl px-3 py-2.5 text-xs text-stone-100 focus:outline-none focus:border-rose-400" />
                                <textarea id="cNotes" placeholder="Notatki (preferencje, uczulenia...)" class="w-full bg-stone-900 border border-stone-700 rounded-xl px-3 py-2.5 text-xs text-stone-100 focus:outline-none focus:border-rose-400"></textarea>
                                <button onclick="app.addClient()" class="w-full py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs rounded-xl shadow-lg transition">Zapisz klientkę</button>
                            </div>

                            <div class="space-y-3">
                                <h2 class="font-bold text-sm text-stone-300 px-1">Lista Klientek (${this.clients.length})</h2>
                                ${this.clients.map(c => `
                                    <div class="bg-stone-800 p-4 rounded-2xl border border-stone-700/50 space-y-2">
                                        <div class="flex justify-between items-start">
                                            <div>
                                                <h3 class="font-bold text-stone-100 text-sm">${c.name}</h3>
                                                <p class="text-xs text-stone-400">📞 ${c.phone || 'Brak numeru'}</p>
                                            </div>
                                            <button onclick="app.deleteClient(${c.id})" class="text-stone-500 hover:text-rose-400 text-xs">🗑️</button>
                                        </div>
                                        <div class="bg-stone-900/50 p-2.5 rounded-xl text-xs text-stone-300 border border-stone-700/30">
                                            <strong>Notatki:</strong> ${c.notes || 'Brak notatek'}
                                        </div>
                                        <button onclick="app.copyLink('${c.token}')" class="w-full py-2 bg-stone-700 hover:bg-stone-600 text-stone-200 text-xs font-semibold rounded-xl transition">
                                            🔗 Kopiuj link dla klientki (SMS)
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else if (this.currentTab === 'calendar') {
                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="bg-stone-800 p-4 rounded-2xl border border-stone-700/50 space-y-3">
                                <h2 class="font-bold text-sm text-stone-200">📅 Zaplanuj wizytę</h2>
                                <input type="text" id="aClient" placeholder="Imię klientki" class="w-full bg-stone-900 border border-stone-700 rounded-xl px-3 py-2.5 text-xs text-stone-100 focus:outline-none focus:border-rose-400" />
                                <input type="datetime-local" id="aDate" class="w-full bg-stone-900 border border-stone-700 rounded-xl px-3 py-2.5 text-xs text-stone-100 focus:outline-none focus:border-rose-400" />
                                <input type="text" id="aService" placeholder="Rodzaj usługi (np. Hybryda)" class="w-full bg-stone-900 border border-stone-700 rounded-xl px-3 py-2.5 text-xs text-stone-100 focus:outline-none focus:border-rose-400" />
                                <button onclick="app.addAppt()" class="w-full py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs rounded-xl shadow-lg transition">Dodaj wizytę</button>
                            </div>

                            <div class="space-y-3">
                                <h2 class="font-bold text-sm text-stone-300 px-1">Nadchodzące wizyty</h2>
                                ${this.appointments.map(a => `
                                    <div class="bg-stone-800 p-4 rounded-2xl border border-stone-700/50 flex justify-between items-center">
                                        <div>
                                            <h3 class="font-bold text-stone-100 text-sm">${a.clientName}</h3>
                                            <p class="text-xs text-rose-400 font-medium mt-0.5">🕒 ${a.date}</p>
                                            <p class="text-[11px] text-stone-400 mt-1">${a.service}</p>
                                        </div>
                                        <span class="text-xs bg-rose-500/20 text-rose-300 px-2.5 py-1 rounded-lg border border-rose-500/30">Zaplanowana</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else if (this.currentTab === 'settings') {
                    container.innerHTML = `
                        <div class="bg-stone-800 p-5 rounded-2xl border border-stone-700/50 space-y-4">
                            <h2 class="font-bold text-sm text-stone-200">⚙️ Ustawienia i Dane</h2>
                            <p class="text-xs text-stone-400">Aplikacja działa w trybie natywnym na Twoim urządzeniu. Wszystkie dane klientek są bezpiecznie przechowywane w pamięci telefonu.</p>
                            <button onclick="app.exportData()" class="w-full py-2.5 bg-stone-700 hover:bg-stone-600 text-stone-200 text-xs font-semibold rounded-xl transition">📤 Eksportuj kopię zapasową (JSON)</button>
                            <button onclick="localStorage.clear(); location.reload();" class="w-full py-2.5 bg-red-500/20 hover:bg-red-500/30 text-red-300 text-xs font-semibold rounded-xl border border-red-500/30 transition">⚠️ Wyczyść dane aplikacji</button>
                        </div>
                    `;
                }
            },

            addClient() {
                const name = document.getElementById('cName').value;
                const phone = document.getElementById('cPhone').value;
                const notes = document.getElementById('cNotes').value;
                if(!name) { alert('Wpisz imię klientki!'); return; }
                
                const token = Math.random().toString(36).substring(2, 10);
                this.clients.unshift({ id: Date.now(), name, phone, notes, token });
                this.saveLocal();
                this.render();
            },

            deleteClient(id) {
                if(confirm('Na pewno usunąć tę klientkę?')) {
                    this.clients = this.clients.filter(c => c.id !== id);
                    this.saveLocal();
                    this.render();
                }
            },

            addAppt() {
                const clientName = document.getElementById('aClient').value;
                const date = document.getElementById('aDate').value;
                const service = document.getElementById('aService').value;
                if(!clientName || !date) { alert('Uzupełnij imię i datę wizyty!'); return; }

                this.appointments.unshift({ id: Date.now(), clientName, date: date.replace('T', ' '), service });
                this.saveLocal();
                this.render();
            },

            copyLink(token) {
                const link = window.location.origin + window.location.pathname + '?token=' + token;
                navigator.clipboard.writeText(link);
                alert('Skopiowano unikalny link dla klientki do schowka!');
            },

            exportData() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({clients: this.clients, appointments: this.appointments}));
                const dlAnchor = document.createElement('a');
                dlAnchor.setAttribute("href", dataStr);
                dlAnchor.setAttribute("download", "nail_backup.json");
                document.body.appendChild(dlAnchor);
                dlAnchor.click();
                dlAnchor.remove();
            },

            syncData() {
                alert('Wszystkie dane są bezpiecznie zapisane na tym urządzeniu!');
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
