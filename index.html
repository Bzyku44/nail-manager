<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NailStudio Manager</title>
    <!-- Tailwind CSS dla szybkiego i ładnego stylu -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col justify-between">

    <!-- GŁÓWNY KONTENER APLIKACJI -->
    <main id="app" class="max-w-md mx-auto w-full p-4 flex-grow flex flex-col justify-center">
        <!-- Zawartość będzie dynamicznie podmieniana przez JavaScript -->
        <div class="text-center py-12">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-rose-400 mx-auto mb-4"></div>
            <p class="text-stone-500 text-sm">Ładowanie aplikacji...</p>
        </div>
    </main>

    <!-- STOPKA -->
    <footer class="text-center py-4 text-xs text-stone-400">
        NailStudio Manager &copy; 2026
    </footer>

    <!-- SKRYPT LOGIKI APLIKACJI -->
    <script>
        // Symulacja bazy danych w pamięci (w prawdziwej aplikacji zastąpioną Supabase / Firebase)
        const mockClients = [
            { id: 1, name: "Anna Nowak", phone: "+48 500 600 700", token: "ania123", nextVisit: "Piątek, 20 listopada, 14:00", notes: "Uczulona na bazę X, lubi kawę z mlekiem owsianym." },
            { id: 2, name: "Katarzyna Kowalska", phone: "+48 501 602 703", token: "Kasia456", nextVisit: "Poniedziałek, 23 listopada, 10:00", notes: "Preferuje krótkie kwadratowe paznokcie." }
        ];

        const mockPhotos = {
            1: ["https://images.unsplash.com/photo-1632345031435-8777f6b9ae8c?w=400", "https://images.unsplash.com/photo-1604654894610-df63bc536371?w=400"],
            2: ["https://images.unsplash.com/photo-1519014816548-bf5fe059798b?w=400"]
        };

        const publicInspirations = [
            { id: 1, title: "Klasyczny French", img: "https://images.unsplash.com/photo-1604654894610-df63bc536371?w=400" },
            { id: 2, title: "Babyboomer Elegance", img: "https://images.unsplash.com/photo-1632345031435-8777f6b9ae8c?w=400" }
        ];

        // Główna funkcja routingu po załadowaniu strony
        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const view = urlParams.get('view');

            const appContainer = document.getElementById('app');

            if (token) {
                // WIDOK KLIENTKI (jeśli w adresie jest np. ?token=ania123)
                const client = mockClients.find(c => c.token === token);
                if (!client) {
                    appContainer.innerHTML = `<div class="text-center"><h2 class="text-xl font-bold text-rose-500 mb-2">Błąd dostępu</h2><p class="text-stone-600 text-sm">Nie znaleziono profilu lub link jest niepoprawny.</p></div>`;
                    return;
                }
                renderClientView(client, appContainer);
            } else if (view === 'admin') {
                // WIDOK ŻONY / ADMINISTRATORA (?view=admin)
                renderAdminView(appContainer);
            } else {
                // STRONA STARTOWA WYBORU WIDOKU (dla celów testowych)
                appContainer.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-100 text-center">
                        <h1 class="text-2xl font-bold text-stone-800 mb-2">💅 NailStudio Manager</h1>
                        <p class="text-stone-500 text-sm mb-6">Wybierz widok do testowania aplikacji:</p>
                        <div class="space-y-3">
                            <a href="?view=admin" class="block w-full py-3 bg-stone-900 text-white rounded-xl font-medium text-sm shadow-sm hover:bg-stone-800 transition">Panel Żony (Administrator)</a>
                            <a href="?token=ania123" class="block w-full py-3 bg-rose-500 text-white rounded-xl font-medium text-sm shadow-sm hover:bg-rose-600 transition">Panel Klientki (Ania Nowak)</a>
                        </div>
                    </div>
                `;
            }
        }

        // --- RENDEROWANIE: PANEL KLIENTKI ---
        function renderClientView(client, container) {
            const photos = mockPhotos[client.id] || [];
            
            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Nagłówek powitalny -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
                        <span class="text-xs uppercase tracking-wider text-rose-500 font-semibold">Twój profil salonu</span>
                        <h2 class="text-2xl font-bold text-stone-800 mt-1">Cześć, ${client.name.split(' ')[0]}! 👋</h2>
                    </div>

                    <!-- Nadchodząca wizyta -->
                    <div class="bg-rose-50 border border-rose-100 p-5 rounded-2xl">
                        <div class="flex items-center space-x-3 mb-2">
                            <span class="text-xl">📅</span>
                            <h3 class="font-semibold text-stone-800 text-sm">Twoja następna wizyta</h3>
                        </div>
                        <p class="text-rose-900 font-bold text-lg mb-3">${client.nextVisit}</p>
                        <button onclick="alert('Zapisano przypomnienie w kalendarzu!')" class="w-full py-2.5 bg-rose-500 text-white text-xs font-semibold rounded-xl shadow-sm hover:bg-rose-600 transition">
                            Dodaj do kalendarza telefonu
                        </button>
                    </div>

                    <!-- Prywatny Album Paznokci -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-100">
                        <h3 class="font-semibold text-stone-800 text-sm mb-3">✨ Twoje dotychczasowe paznokcie</h3>
                        <div class="grid grid-cols-2 gap-3">
                            ${photos.length > 0 ? photos.map(img => `<img src="${img}" class="rounded-xl object-cover h-32 w-full border border-stone-100" />`).join('') : '<p class="text-xs text-stone-400 col-span-2">Brak zdjęć w historii.</p>'}
                        </div>
                    </div>

                    <!-- Galeria Inspiracji -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-100">
                        <h3 class="font-semibold text-stone-800 text-sm mb-3">💡 Inspiracje z salonu</h3>
                        <div class="grid grid-cols-2 gap-3">
                            ${publicInspirations.map(insp => `
                                <div class="relative group">
                                    <img src="${insp.img}" class="rounded-xl object-cover h-32 w-full border border-stone-100" />
                                    <button onclick="alert('Wybrano wzór: ${insp.title}! Żona została powiadomiona.')" class="absolute bottom-2 left-2 right-2 py-1.5 bg-white/90 backdrop-blur-sm text-stone-800 text-[10px] font-bold rounded-lg shadow-sm hover:bg-white transition">
                                        Chcę taki! 💖
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- RENDEROWANIE: PANEL ŻONY (ADMIN) ---
        function renderAdminView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-stone-100">
                        <div>
                            <span class="text-xs text-stone-400 font-medium">Panel Zarządzania</span>
                            <h2 class="text-lg font-bold text-stone-800">Kalendarz Salonu 📋</h2>
                        </div>
                        <a href="?" class="text-xs font-semibold text-stone-500 hover:text-stone-800">Wyloguj</a>
                    </div>

                    <!-- Lista klientek / wizyt -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-100 space-y-4">
                        <h3 class="font-semibold text-stone-800 text-sm">Nadchodzące wizyty</h3>
                        
                        ${mockClients.map(client => `
                            <div class="p-4 bg-stone-50 rounded-xl border border-stone-100 space-y-2">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h4 class="font-bold text-stone-800 text-sm">${client.name}</h4>
                                        <p class="text-xs text-stone-500">${client.phone}</p>
                                    </div>
                                    <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full font-medium">Potwierdzona</span>
                                </div>
                                <p class="text-xs text-rose-600 font-medium">Termin: ${client.nextVisit}</p>
                                <div class="bg-white p-2.5 rounded-lg border border-stone-200 text-xs text-stone-600">
                                    <strong>Notatki:</strong> ${client.notes}
                                </div>
                                <div class="pt-1 flex space-x-2">
                                    <button onclick="navigator.clipboard.writeText(window.location.origin + '/?token=${client.token}'); alert('Skopiowano unikalny link dla ${client.name}!');" class="flex-1 py-2 bg-stone-900 text-white text-xs font-semibold rounded-lg shadow-sm hover:bg-stone-800 transition">
                                        Kopiuj link SMS 🔗
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Uruchomienie aplikacji przy starcie strony
        window.onload = initApp;
    </script>
</body>
</html>
